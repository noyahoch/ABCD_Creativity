# Tables 2, 3, 8, 9 | mistral | Denial prompting, MacGyver (Lu et al., 2024) | seed 42
run_id: denial_macgyver_s42
output_root: results/main/mistral
model_name: mistralai/Mistral-Small-24B-Instruct-2501
seed: 42

aut:
  abcd_data: data/aut_bridgeset.json
  eval_seed: 7
  eval_holdout: 40
  prompts:
    default_subject: full_instruction
    allow_decoupling: true
    decoupling_reason: Steering vectors use the bridge prompt; inference uses the paper prompt.
    steering:
      prompt_id: aut_user_a_paper_bridge
    inference:
      prompt_id: aut_user_a_paper_infer

steering:
  bridge_source: multi_b_concat
  method: mean_diff
  default_source: D_banal
  probe_layers: [18, 19, 20, 21, 22, 23]
  window: 0
  collect_span: assistant_full
  steer_target: residual
  steer_scale: fixed
  method_kwargs: {}
  source_kwargs: {}

decoding_aut:
  temperature: 0.7
  top_p: null
  min_p: null
  max_new_tokens: 384
  num_inferences: 1
  batch_size: 32

macgyver_data: data/macgyver/problem_solution_pair.xlsx
macgyver:
  prompt_style: default
  subset: solvable_unconventional
  max_items: null

decoding_macgyver:
  temperature: 0.7
  top_p: null
  min_p: null
  max_new_tokens: 384
  num_inferences: 1
  batch_size: 32

denial:
  rounds: 3
  reviewer_aut_prompt_id: aut_reviewer_approaches_v1
  reviewer_macgyver_prompt_id: macgyver_reviewer_approaches_v1
  aut_denial_prompt_id: aut_user_a_paper_infer_denial_v1
  macgyver_denial_prompt_id: macgyver_user_default_denial_v1
  reviewer_temperature: 0.0
  reviewer_max_tokens: 256
  reviewer_max_concurrent: 64
  reviewer_max_retries: 3
  reviewer_timeout_s: 120.0
  reviewer_seed: 42
  reviewer_backend:
    type: vllm
    base_url: http://localhost:8001/v1
    model: Qwen/Qwen2.5-32B-Instruct-AWQ

macgyver_judge:
  prompt_id: macgyver_judge_additive_5pt_v1
  temperature: 0.0
  max_concurrent: 128
  max_retries: 3
  timeout_s: 600.0
  max_tokens: 256
  seed: 42
  backend:
    type: vllm
    base_url: http://localhost:8001/v1
    model: Qwen/Qwen2.5-32B-Instruct-AWQ

ocsai:
  url: https://openscoring.du.edu/llm
  model: ocsai2
  batch_size: 40
  timeout_s: 300.0
  max_attempts: 10
  retry_backoff_s: 8.0
  max_concurrency: 1

originality:
  ngram_index: results/novelty/fineweb_500m.npz
  n_values: [4, 5, 6]

diversity:
  embedding_model: all-MiniLM-L6-v2
  force_cpu: false

vllm_server:
  enable: true
  model: Qwen/Qwen2.5-32B-Instruct-AWQ
  host: 0.0.0.0
  port: 8001
  quantization: awq
  tensor_parallel_size: 1
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  startup_timeout_s: 900
  poll_interval_s: 5
  terminate_timeout_s: 120
  reuse_existing: true
  keep_alive: false

allow_archived_prompts: false

experimental:
  verbose_stages: true
